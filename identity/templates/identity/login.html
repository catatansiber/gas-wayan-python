{% extends "base.html" %}
{% block title %}Masuk - Gas Wayan{% endblock %}
{% block container_class %} narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Masuk</h1>
  {% if form.errors %}
    <p class="error">Nama pengguna atau kata sandi salah.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Nama pengguna</label>
    <input type="text" name="username" id="id_username" autofocus required>
    <label for="id_password">Kata sandi</label>
    <input type="password" name="password" id="id_password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Masuk</button>
  </form>
</div>
{% endblock %}
