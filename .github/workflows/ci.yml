name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: gaswayan_ci
          POSTGRES_USER: gaswayan
          POSTGRES_PASSWORD: gaswayan_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaswayan -d gaswayan_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://gaswayan:gaswayan_ci_password@localhost:5432/gaswayan_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Django system check
        run: python manage.py check

      - name: Migrations up to date (no missing migrations)
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: python manage.py test --settings=config.settings.test
