{% if page_obj.paginator.num_pages > 1 %}
<div class="pagination">
  {% if page_obj.has_previous %}
  <a href="?{{ page_param|default:"page" }}={{ page_obj.previous_page_number }}">&laquo; Sebelumnya</a>
  {% endif %}
  <span class="current">Halaman {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
  <a href="?{{ page_param|default:"page" }}={{ page_obj.next_page_number }}">Berikutnya &raquo;</a>
  {% endif %}
</div>
{% endif %}
