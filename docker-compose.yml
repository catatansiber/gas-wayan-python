# Compose khusus proyek Python ini. Terpisah total dari ../Gas Wayan/compose.yaml (proyek
# TypeScript lama) - nama proyek, port host, dan volume berbeda supaya keduanya bisa hidup
# berdampingan tanpa bentrok.
name: gas-wayan-python

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: gaswayan_dev
      POSTGRES_USER: gaswayan
      POSTGRES_PASSWORD: gaswayan_dev_password
    ports:
      - '55432:5432'   # host 55432 (bukan 5432) supaya tidak bentrok dengan ../Gas Wayan/compose.yaml
    volumes:
      # Image postgres:18+ menyimpan data di subdirektori bertingkat-versi di bawah
      # /var/lib/postgresql (bukan /var/lib/postgresql/data seperti image <18) supaya
      # kompatibel dengan pg_upgrade --link. Mount di /var/lib/postgresql/data akan gagal
      # start dengan pesan error dari image resmi.
      - gaswayanpy_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gaswayan -d gaswayan_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  gaswayanpy_postgres_data:
